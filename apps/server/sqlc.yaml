# 스키마(SQL)가 코드를 만든다. 반대 방향(ORM AutoMigrate)이 아니다.
#
# 001_init.sql 에는 ORM으로 표현되지 않는 것이 여럿 있다 — interventions 의 CHECK 제약,
# kb_chunks 의 부분 인덱스, pgvector 의 `vector` 타입. 그걸 코드로 옮겨 적기 시작하면
# 스키마가 두 벌이 되고, 어긋났을 때 어느 쪽이 맞는지 알 수 없다.
#
#   go tool sqlc generate     (apps/server 에서)
version: '2'
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/query
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        # 컬럼 이름이 그대로 필드가 되면 SfenKey·PlyHint 처럼 읽힌다. 그건 그대로 두고,
        # 약어만 Go 관례에 맞춘다.
        rename:
          usi: USI
          sfen_key: SFENKey
          child_key: ChildKey
          parent_key: ParentKey
