# 스키마(SQL)가 코드를 만든다. 반대 방향(ORM AutoMigrate)이 아니다.
#
# 마이그레이션에는 ORM으로 표현되지 않는 것이 여럿 있다 — interventions 의 CHECK 제약,
# 부분 인덱스, GIN 인덱스. 그걸 코드로 옮겨 적기 시작하면
# 스키마가 두 벌이 되고, 어긋났을 때 어느 쪽이 맞는지 알 수 없다.
#
#   go tool sqlc generate     (apps/server 에서)
version: '2'
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/query
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        # 원소마다 NULL 이 있는 배열이다. sqlc 는 배열 원소의 널 가능성을 못 보므로
        # ([]int32 로 낸다) 여기서 짚어 준다 — 안 짚으면 스캔이 그 자리에서 실패한다.
        # 두 배열은 길이가 같고 같은 자리에서 하나만 값이 있다(021_tagged_evals.sql).
        overrides:
          - column: edges.eval_by_depth
            go_type:
              type: int32
              pointer: true
              slice: true
          - column: edges.mate_by_depth
            go_type:
              type: int32
              pointer: true
              slice: true
        # 컬럼 이름이 그대로 필드가 되면 SfenKey·PlyHint 처럼 읽힌다. 그건 그대로 두고,
        # 약어만 Go 관례에 맞춘다.
        rename:
          usi: USI
          sfen_key: SFENKey
          child_key: ChildKey
          parent_key: ParentKey
