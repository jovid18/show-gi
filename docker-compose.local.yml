# 로컬 전용. 배포에서는 RDS가 이 자리를 대신한다.
#
# `.env`의 COMPOSE_FILE이 이 파일을 기본으로 겹쳐주므로 그냥 `docker compose up -d`면 된다.

services:
  db:
    # postgres가 아니라 pgvector 이미지다. kb_chunks의 임베딩 컬럼에 vector 확장이
    # 필요하고, 확장은 이미지에 들어 있어야 CREATE EXTENSION이 먹는다.
    # RDS PostgreSQL 17도 같은 확장을 지원하므로 로컬과 배포가 갈리지 않는다
    image: pgvector/pgvector:pg17
    container_name: show-gi-db
    environment:
      POSTGRES_USER: showgi
      POSTGRES_PASSWORD: showgi # 로컬 전용. 루프백에만 열려 있다
      POSTGRES_DB: showgi
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - show-gi-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U showgi']
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  api:
    environment:
      # 로컬 기본값. .env에 DATABASE_URL을 적으면 그쪽이 이긴다
      DATABASE_URL: ${DATABASE_URL:-postgres://showgi:showgi@db:5432/showgi?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy

volumes:
  show-gi-dbdata:
