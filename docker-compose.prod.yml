# 배포 오버레이. Caddy가 TLS를 끝내고 정적 파일을 서빙하며 api로 프록시한다.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# SITE_ADDRESS와 ACME_EMAIL은 .env에서 온다 (deploy/README.md).

services:
  web:
    build:
      # 컨텍스트가 레포 루트인 것은 pnpm 워크스페이스의 lockfile이 루트에 있어서다
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: show-gi-web
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      # 발급받은 인증서. 이걸 안 남기면 재시작마다 재발급을 시도하다
      # Let's Encrypt 발급 한도(주당 5회)에 걸려 사이트가 평문으로 떨어진다
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  # 배포에서는 외부에 직접 노출하지 않는다. 진입점은 Caddy 하나뿐이다.
  api:
    ports: !override
      - '127.0.0.1:8080:8080'

  db:
    ports: !override
      - '127.0.0.1:5432:5432'

volumes:
  caddy-data:
  caddy-config:
