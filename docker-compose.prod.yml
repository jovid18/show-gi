# 배포 오버레이. Caddy가 TLS를 끝내고 정적 파일을 서빙하며 api로 프록시한다.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 이미지는 인스턴스에서 굽지 않는다. GitHub Actions가 arm64로 구워 ECR에 올리고
# 여기서는 받아 오기만 한다 — 8GiB 박스에서 빌드하면 postgres·엔진과 메모리를 다툰다.
#
# 환경변수는 SSM Parameter Store에서 온다 (deploy/env.sh).
#
# postgres 서비스가 없다 — 배포에서는 RDS다.

services:
  web:
    image: ${REGISTRY}/show-gi/web:${IMAGE_TAG:-latest}
    container_name: show-gi-web
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      # 발급받은 인증서. 이걸 안 남기면 재시작마다 재발급을 시도하다
      # Let's Encrypt 발급 한도(주당 5회)에 걸려 사이트가 평문으로 떨어진다
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  # 배포에서는 외부에 직접 노출하지 않는다. 진입점은 Caddy 하나뿐이다.
  api:
    image: ${REGISTRY}/show-gi/api:${IMAGE_TAG:-latest}
    build: !reset null # 개발용 compose의 build를 지운다. 여기서는 받아 온 이미지만 쓴다
    ports: !override
      - '127.0.0.1:8080:8080'

volumes:
  caddy-data:
  caddy-config:
