# main에 들어온 것을 굽고, 그대로 배포한다.
#
# pull_request에서는 아무것도 하지 않는다. 퍼블릭 레포라 아무나 PR을 열 수 있고,
# PR에서 이미지를 밀거나 배포를 걸 수 있으면 배포되는 것의 출처가 열린다.
# 코드 검증은 Web/Server 워크플로가 PR에서 하고, 여기는 통과한 main만 다룬다.

name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC로 AWS 단기 자격증명을 받는다. 장기 키를 CI에 두지 않는다

# 배포가 겹치면 나중 것이 먼저 끝나 옛 커밋이 살아남을 수 있다.
# 취소하지 않고 줄을 세우는 것은, 중간 커밋도 배포 이력에 남는 편이 낫기 때문이다.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  REGISTRY: 058264445568.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  build:
    # arm64 러너. 인스턴스가 Graviton이라 아키텍처가 그대로 맞고,
    # QEMU 에뮬레이션을 쓰지 않으므로 빌드가 몇 배 빠르다.
    # (퍼블릭 레포라 이 러너는 무료다)
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/server/Dockerfile
            context: apps/server
          - name: web
            dockerfile: apps/web/Dockerfile
            context: . # pnpm 워크스페이스라 루트의 lockfile이 필요하다

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::058264445568:role/show-gi-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # 커밋 SHA 태그가 배포의 진짜 이름이다. latest는 편의용이고,
          # 무엇이 떠 있는지 확인할 때는 SHA를 본다
          tags: |
            ${{ env.REGISTRY }}/show-gi/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/show-gi/${{ matrix.name }}:latest
          # 레이어 캐시를 GitHub Actions 캐시에 둔다. 없으면 매번 pnpm install부터 다시 한다
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build # 두 이미지가 다 올라간 뒤에만
    runs-on: ubuntu-latest

    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::058264445568:role/show-gi-github-actions
          aws-region: ${{ env.AWS_REGION }}

      # SSH를 열지 않고 배포한다. 인바운드 포트가 없으므로 열어둘 것도, 지킬 것도 없다.
      # 인스턴스는 ID가 아니라 태그로 찾는다 — 인스턴스를 다시 만들어도 CI를 안 고친다.
      - name: SSM으로 배포 실행
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters 'Name=tag:Project,Values=show-gi' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "✗ show-gi 인스턴스를 못 찾았다. terraform apply 했는지 확인할 것"
            exit 1
          fi
          echo "대상: $INSTANCE_ID"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "commands=['sudo -u ec2-user /opt/show-gi/deploy/deploy.sh $GITHUB_SHA']" \
            --query 'Command.CommandId' --output text)

          # 끝날 때까지 기다린다. 기다리지 않으면 배포가 실패해도 워크플로가 초록으로 남는다.
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)

          echo "--- 인스턴스 출력 ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- 에러 출력 ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text
            echo "✗ 배포 실패: $STATUS"
            exit 1
          fi

          echo "✓ https://show-gi.com 에 ${GITHUB_SHA::7} 반영됨"
