# main에 들어온 것만 이미지로 굽는다.
#
# pull_request에서는 굽지 않는다. 퍼블릭 레포라 아무나 PR을 열 수 있고, PR에서
# 이미지를 밀 수 있으면 배포되는 이미지의 출처가 열린다. 코드 검증은 Web/Server
# 워크플로가 PR에서 하고, 여기는 통과한 main만 굽는다.

name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC로 AWS 단기 자격증명을 받는다. 장기 키를 CI에 두지 않는다

env:
  AWS_REGION: ap-northeast-1
  REGISTRY: 058264445568.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  build:
    # arm64 러너. 인스턴스가 Graviton이라 아키텍처가 그대로 맞고,
    # QEMU 에뮬레이션을 쓰지 않으므로 빌드가 몇 배 빠르다.
    # (퍼블릭 레포라 이 러너는 무료다)
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/server/Dockerfile
            context: apps/server
          - name: web
            dockerfile: apps/web/Dockerfile
            context: . # pnpm 워크스페이스라 루트의 lockfile이 필요하다

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::058264445568:role/show-gi-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # 커밋 SHA 태그가 배포의 진짜 이름이다. latest는 편의용이고,
          # 무엇이 떠 있는지 확인할 때는 SHA를 본다
          tags: |
            ${{ env.REGISTRY }}/show-gi/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/show-gi/${{ matrix.name }}:latest
          # 레이어 캐시를 GitHub Actions 캐시에 둔다. 없으면 매번 pnpm install부터 다시 한다
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
