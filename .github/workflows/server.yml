# apps/server 검증. 로컬에서 그 디렉터리에 들어가 돌리는 것과 같다.
#
# -race는 빼지 않는다. 대국 세션 하나를 goroutine 하나가 소유하고 엔진 프로세스가
# 여러 개 동시에 도는 구조라, 가장 값비싼 버그가 데이터 경합이다.

name: Server

on:
  push:
    branches: [main]
  pull_request:

# 체크아웃에 필요한 것만 준다. 레포 기본값도 현재 read지만 그건 설정이라
# 언제든 바뀌고 포크에는 따라가지 않는다. 파일에 박아두는 쪽이 실제 보증이다.
permissions:
  contents: read

defaults:
  run:
    working-directory: apps/server

jobs:
  # job 이름이 그대로 필수 체크의 컨텍스트가 된다. web.yml과 겹치면 룰셋이
  # 어느 쪽을 가리키는지 알 수 없어 체크가 영원히 대기 상태로 남는다.
  server:
    runs-on: ubuntu-latest

    # 국면 캐시의 "얕은 결과가 깊은 결과를 못 덮는다"는 규칙은 **SQL의 WHERE 절에만**
    # 있다. Go 쪽에 옮겨 적지 않았으므로 진짜 postgres 없이는 검증할 수 없다.
    # pgvector 이미지인 것은 kb_chunks 때문이다(로컬 compose·RDS와 같은 확장).
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: showgi
          POSTGRES_PASSWORD: showgi
          POSTGRES_DB: showgi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U showgi"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          # go.mod를 키로 삼지 않는 것은, 간접 의존성 버전이 go.mod에 다 적히지
          # 않아 캐시가 실제 의존성 집합과 어긋날 수 있어서다.
          cache-dependency-path: apps/server/go.sum

      # gofmt는 어긋난 파일 이름을 출력할 뿐 실패하지 않는다. 출력이 있으면 여기서 멈춘다.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "✗ gofmt가 어긋난 파일:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # 마이그레이션을 **전부, 번호 순서대로** 적용한다.
      #
      # 001만 적으면 새 마이그레이션이 CI에서 안 돌아 「로컬은 통과하는데 CI만 깨지는」
      # 상태가 된다. 파일 이름이 정렬 순서를 정하므로 glob 하나면 된다.
      - name: 스키마 적용
        run: |
          for f in internal/store/migrations/*.sql; do
            echo "→ $f"
            PGPASSWORD=showgi psql -h localhost -U showgi -d showgi -v ON_ERROR_STOP=1 -f "$f"
          done

      - run: go test -race ./...
        env:
          SHOWGI_TEST_DATABASE_URL: postgres://showgi:showgi@localhost:5432/showgi
      - run: go build ./...
