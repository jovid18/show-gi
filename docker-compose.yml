# 공통. 어디서 돌든 있는 것만 여기 둔다.
#
# DB는 여기 없다 — 로컬은 docker-compose.local.yml의 컨테이너, 배포는 RDS다.
# 웹(Caddy)도 없다 — 로컬은 `pnpm dev`가 띄우고 Vite가 :8080의 api로 프록시한다.
#
#   로컬:  docker compose up -d        (.env의 COMPOSE_FILE이 local을 겹쳐준다)
#   배포:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    build: ./apps/server
    container_name: show-gi-api
    ports:
      - '127.0.0.1:8080:8080' # 로컬 개발용. 외부에 열지 않는다
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENGINE_CMD: ${ENGINE_CMD:-fairy-stockfish}
      ORCA_API_KEY: ${ORCA_API_KEY:-}
      ORCA_BASE_URL: ${ORCA_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    restart: unless-stopped
