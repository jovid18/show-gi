# 개발용. 웹은 여기 없다 — `pnpm dev`로 띄우고 Vite 프록시가 :8080의 api로 넘긴다.
# 배포는 docker-compose.prod.yml을 겹쳐서 웹(Caddy)까지 올린다.

services:
  api:
    build: ./apps/server
    container_name: show-gi-api
    ports:
      - '127.0.0.1:8080:8080' # 로컬 개발용. 외부에 열지 않는다
    environment:
      # 기본값은 로컬 개발용이다. 배포에서는 Parameter Store에서 온 값이 덮는다
      DATABASE_URL: postgres://showgi:${POSTGRES_PASSWORD:-showgi}@db:5432/showgi?sslmode=disable
      ENGINE_CMD: fairy-stockfish
    # OrcaRouter 키와 OAuth 시크릿. 없으면 해당 기능만 비활성이고 나머지는 뜬다
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    # postgres가 아니라 pgvector 이미지다. kb_chunks의 임베딩 컬럼에 vector 확장이 필요하고,
    # 확장은 이미지에 들어 있어야 CREATE EXTENSION이 먹는다
    image: pgvector/pgvector:pg17
    container_name: show-gi-db
    environment:
      POSTGRES_USER: showgi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-showgi}
      POSTGRES_DB: showgi
    ports:
      - '127.0.0.1:5432:5432' # psql로 붙어볼 때만. 루프백에만 바인딩한다
    volumes:
      - show-gi-dbdata:/var/lib/postgresql/data
      # 이 디렉터리의 .sql은 **볼륨이 비어 있을 때 한 번만** 실행된다.
      # 스키마를 고쳤는데 반영이 안 되면 볼륨이 남아 있는 것이다:
      #   docker compose down -v && docker compose up -d
      - ./apps/server/internal/store/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U showgi']
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

volumes:
  show-gi-dbdata:
